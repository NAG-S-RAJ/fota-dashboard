<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FOTA Campaign Manager</title>
<script>

if(
    localStorage.getItem(
        "fota_logged_in"
    ) !== "true"
){

    window.location =
        "login.html";
}

</script>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:#0b1220;
    color:#e5e7eb;
}

/* =====================================
   HEADER
===================================== */

.header{
    background:#111827;
    border-bottom:1px solid #1f2937;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:26px;
    font-weight:700;
    color:#3b82f6;
}

.subtitle{
    color:#94a3b8;
    font-size:14px;
}

/* =====================================
   KPI BAR
===================================== */

.kpiRow{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:20px;
    margin:20px;
}

.kpi{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:12px;
    padding:20px;
}

.kpiValue{
    font-size:34px;
    font-weight:700;
    color:#60a5fa;
}

.kpiLabel{
    color:#94a3b8;
    margin-top:5px;
}

/* =====================================
   LAYOUT
===================================== */

.container{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:
        1fr 1fr;
    gap:20px;
}

/* =====================================
   CARDS
===================================== */

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:14px;
    padding:20px;
}

.card h2{
    margin-bottom:15px;
    color:#f9fafb;
}

/* =====================================
   INPUTS
===================================== */

input{
    width:100%;
    padding:12px;
    border:1px solid #374151;
    border-radius:8px;
    background:#1f2937;
    color:white;
    margin-bottom:12px;
}

input[type=file]{
    padding:10px;
}

/* =====================================
   BUTTONS
===================================== */

button{
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
    font-weight:600;
}

.primary{
    background:#2563eb;
    color:white;
}

.primary:hover{
    background:#1d4ed8;
}

.approve{
    background:#16a34a;
    color:white;
}

.approve:hover{
    background:#15803d;
}

.reject{
    background:#dc2626;
    color:white;
}

.reject:hover{
    background:#b91c1c;
}

/* =====================================
   TBM CARDS
===================================== */

.pendingItem,
.onlineItem,
.campaignItem{
    background:#1f2937;
    border:1px solid #374151;
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:8px;
    font-size:13px;
}

/* =====================================
   STATUS BADGES
===================================== */

.badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.online{
    background:#14532d;
    color:#86efac;
}

.pending{
    background:#78350f;
    color:#fde68a;
}

.completed{
    background:#0f766e;
    color:#99f6e4;
}

/* =====================================
   LOGS
===================================== */
.fullWidth{
    grid-column: 1 / -1;
}
.card.fullWidth{
    width:100%;
}

.consoleHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    width:100%;

    margin-bottom:15px;
}

.consoleHeader h2{

    margin:0;
}

.downloadBtn{

    background:#1976d2;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:8px;

    cursor:pointer;

    font-weight:600;
}
#logs{
    background:#020617;
    border:1px solid #334155;
    border-radius:12px;
    height:350px;
    width:100%;
    overflow-y:auto;
    padding:15px;
    color:#22c55e;
    font-family:Consolas,monospace;
    font-size:13px;
}

#campaignList{
    max-height:220px;
    overflow-y:auto;
    padding-right:5px;
}

#campaignList::-webkit-scrollbar{
    width:8px;
}

#campaignList::-webkit-scrollbar-thumb{
    background:#475569;
    border-radius:10px;
}
/* =====================================
   RESPONSIVE
===================================== */

@media(max-width:1000px){

    .grid{
        grid-template-columns:1fr;
    }

    .kpiRow{
        grid-template-columns:
            1fr 1fr;
    }
}
</style>

</head>

<body>
<div class="header">

    <div>

        <div class="logo">
            Bosch FOTA Operations Center
        </div>

        <div class="subtitle">
            Firmware Over-The-Air Campaign Management
        </div>

    </div>
    <button
onclick="logout()">

Logout

</button>
</div>

<div class="kpiRow">

    <div class="kpi">
        <div id="onlineCount" class="kpiValue">0</div>
        <div class="kpiLabel">
            Connected TBMs
        </div>
    </div>

    <div class="kpi">
        <div id="pendingCount" class="kpiValue">0</div>
        <div class="kpiLabel">
            Pending Requests
        </div>
    </div>

    <div class="kpi">
        <div id="campaignCount" class="kpiValue">0</div>
        <div class="kpiLabel">
            Campaigns
        </div>
    </div>

    <div class="kpi">
        <div class="kpiValue">ONLINE</div>
        <div class="kpiLabel">
            System Status
        </div>
    </div>

</div>

<div class="container">
<div class="grid">
<!-- Pending TBMs -->

<div class="card">

<h2>Pending TBM Requests</h2>

<div id="pendingList">
No Pending Requests
</div>

</div>

<!-- Connected TBMs -->

<div class="card">

<h2>Connected TBMs</h2>

<div id="tbmList">
No Connected TBMs
</div>

</div>

<!-- Campaign Creation -->

<div class="card">

<h2>Create Campaign</h2>

<input
type="text"
id="vin"
placeholder="Target VIN">

<input
type="text"
id="campaignName"
placeholder="Campaign Name">

<input
type="file"
id="campaignFirmware">

<button
class="primary"
onclick="createCampaign()">

Create Campaign

</button>

</div>

<!-- Campaign History -->

<div class="card">

<h2>Campaign History</h2>

<div id="campaignList">
No Campaigns
</div>

</div>
</div>

<div style="height:0.6cm;"></div>

<div>

</div>

<div class="card fullWidth">

    <div class="consoleHeader">

        <h2>Live Activity Console</h2>

        <button
            class="downloadBtn"
            onclick="downloadLogs()">

            Download Logs

        </button>

    </div>

    <div id="logs"></div>

</div>

<script>
    
const SERVER =
"https://fota-demo.onrender.com";

function downloadLogs(){

    window.location =
        "/download_logs";
}

async function deleteCampaign(id){

    if(!confirm(
        "Delete this campaign?"
    )){
        return;
    }

    await fetch(
        SERVER +
        "/campaign/" +
        id,
        {
            method:"DELETE"
        }
    );

    loadCampaigns();
}

/* ==========================
   PENDING TBMS
========================== */

function logout(){

    localStorage.removeItem(
        "fota_logged_in"
    );

    window.location =
        "login.html";
}

async function loadPending(){

    const response =
    await fetch(
        SERVER + "/pending"
    );

    const data =
    await response.json();

    document.getElementById(
    "pendingCount"
    ).innerText =
    data.pending.length;

    const div =
    document.getElementById(
        "pendingList"
    );

    div.innerHTML = "";

    if(data.pending.length === 0){

        div.innerHTML =
        "No Pending Requests";

        return;
    }

    data.pending.forEach(vin=>{

        div.innerHTML +=
        `
        <div class="pendingItem">

            <b>${vin}</b>

            <br><br>

            <button
            class="approve"
            onclick="approveTBM('${vin}')">

            Approve

            </button>

            <button
            class="reject"
            onclick="rejectTBM('${vin}')">

            Reject

            </button>

        </div>
        `;
    });
}


/* ==========================
   CONNECTED TBMS
========================== */

async function loadTBMs(){

    const response =
    await fetch(
        SERVER + "/tbms"
    );

    const data =
    await response.json();

    document.getElementById(
    "onlineCount"
    ).innerText =
    data.online_tbms.length;

    const div =
    document.getElementById(
        "tbmList"
    );

    div.innerHTML = "";

    if(data.online_tbms.length === 0){

        div.innerHTML =
        "No Connected TBMs";

        return;
    }

    data.online_tbms.forEach(vin=>{

        div.innerHTML +=
        `
        <div class="onlineItem">

            VIN : ${vin}

        </div>
        `;
    });
}


/* ==========================
   APPROVE TBM
========================== */

async function approveTBM(vin){

    await fetch(
        SERVER +
        "/approve/" +
        vin,
        {
            method:"POST"
        }
    );

    loadPending();
    loadTBMs();
}


/* ==========================
   REJECT TBM
========================== */

async function rejectTBM(vin){

    await fetch(
        SERVER +
        "/reject/" +
        vin,
        {
            method:"POST"
        }
    );

    loadPending();
}


/* ==========================
   CREATE CAMPAIGN
========================== */

async function createCampaign(){

    const vin =
    document.getElementById(
        "vin"
    ).value;

    const campaign =
    document.getElementById(
        "campaignName"
    ).value;

    const file =
    document.getElementById(
        "campaignFirmware"
    ).files[0];

    if(
        !vin ||
        !campaign ||
        !file
    ){

        alert(
            "Fill all fields"
        );

        return;
    }

    try{

        // -------------------------
        // Upload Firmware
        // -------------------------

        const formData =
        new FormData();

        formData.append(
            "file",
            file
        );

        const uploadResponse =
        await fetch(
            SERVER + "/upload",
            {
                method:"POST",
                body:formData
            }
        );

        const uploadResult =
        await uploadResponse.json();

        const firmwareFile =
        uploadResult.file;

        // -------------------------
        // Create Campaign
        // -------------------------

        const campaignUrl =
            SERVER +
            "/campaign" +
            "?vin=" +
            encodeURIComponent(vin) +
            "&campaign_name=" +
            encodeURIComponent(campaign) +
            "&firmware_file=" +
            encodeURIComponent(
                firmwareFile
            );

        const response =
        await fetch(
            campaignUrl,
            {
                method:"POST"
            }
        );

        const result =
        await response.json();

        alert(
            JSON.stringify(
                result
            )
        );

        loadCampaigns();

    }
    catch(error){

        alert(
            "Campaign Creation Failed"
        );

        console.error(error);
    }
}


/* ==========================
   CAMPAIGNS
========================== */

async function loadCampaigns(){

    const response =
    await fetch(
        SERVER + "/campaigns"
    );

    const campaigns =
    await response.json();

    document.getElementById(
    "campaignCount"
    ).innerText =
    campaigns.length;

    const div =
    document.getElementById(
        "campaignList"
    );

    div.innerHTML = "";

    if(campaigns.length === 0){

        div.innerHTML =
        "No Campaigns";

        return;
    }

    campaigns.forEach(c=>{

        div.innerHTML += `
        <div class="campaignItem">
        
            <div style="
                display:flex;
                justify-content:space-between;
                align-items:flex-start;
            ">
        
                <div>
                
                    <b>${c.campaign_name}</b><br>
                
                    VIN : ${c.vin}<br>
                
                    Firmware : ${c.firmware_file}<br>
                
                    Status : ${c.status}
                
                </div>
            
                <button
                    class="deleteBtn"
                    onclick="deleteCampaign('${c.campaign_id}')">
            
                    Delete
            
                </button>
            
            </div>
        
        </div>
        `;
    });
}


/* ==========================
   LOGS
========================== */

async function loadLogs(){

    const response =
    await fetch(
        SERVER + "/logs"
    );

    const data =
    await response.json();

    const logs =
    document.getElementById(
        "logs"
    );

    logs.innerHTML = "";

    data.forEach(item=>{

        logs.innerHTML +=
        item +
        "<br>";

    });

    logs.scrollTop =
    logs.scrollHeight;
}


/* ==========================
   AUTO REFRESH
========================== */

loadPending();
loadTBMs();
loadLogs();
loadCampaigns();

setInterval(
    loadPending,
    1000
);

setInterval(
    loadTBMs,
    2000
);

setInterval(
    loadLogs,
    1000
);

setInterval(
    loadCampaigns,
    3000
);

</script>

</body>
</html>
