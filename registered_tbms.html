<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>
Registered TBMs
</title>

<style>
body{
    font-family:"Segoe UI",sans-serif;
    background:#0b1220;
    color:white;
    padding:30px;
    margin:0;
}

h1{
    margin-bottom:20px;
    font-size:32px;
    color:#60a5fa;
}

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:16px;
    padding:24px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin-bottom:14px;
    border-radius:10px;
    border:1px solid #374151;
    background:#1f2937;
    color:white;
    font-size:14px;
    transition:0.2s;
}

input:focus{
    outline:none;
    border-color:#60a5fa;
    box-shadow:0 0 0 3px rgba(96,165,250,0.2);
}

button{
    padding:11px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.25s;
}

button:hover{
    transform:translateY(-1px);
}

.primary{
    background:#2563eb;
    color:white;
}

.primary:hover{
    background:#3b82f6;
}

.back-btn{
    background:#1f2937;
    color:white;
    border:1px solid #374151;
}

.back-btn:hover{
    background:#374151;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.delete-btn:hover{
    background:#ef4444;
}

.table-container{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

#tbmTable{
    width:100%;
    border-collapse:collapse;
}

#tbmTable th{
    background:#1f2937;
    color:#60a5fa;
    text-align:left;
    padding:16px;
    font-size:14px;
    letter-spacing:0.5px;
}

#tbmTable td{
    padding:16px;
    border-top:1px solid #374151;
}

#tbmTable tbody tr:nth-child(even){
    background:#151f31;
}

#tbmTable tbody tr:hover{
    background:#1f2937;
}

.vin-badge{
    background:#1e3a8a;
    color:#93c5fd;
    padding:6px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
}

.sw-badge{
    background:#064e3b;
    color:#6ee7b7;
    padding:6px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.subtitle{
    color:#9ca3af;
    margin-top:-10px;
    margin-bottom:25px;
}
</style>
</head>

<body>

<div class="page-header">
    <div>
        <h1>Registered TBMs</h1>
        <div class="subtitle">
            Manage registered TBMs
        </div>
    </div>

    <button
        class="back-btn"
        onclick="window.location='index.html'">
        ← Dashboard
    </button>
</div>

<br><br>

<div class="card">

<input
id="vin"
placeholder="VIN">

<input
id="sw"
placeholder="Software Version">

<button
class="primary"
onclick="addTBM()">

Add TBM

</button>

</div>

<br>

<div class="table-container">
<table id="tbmTable">

    <thead>

        <tr>

            <th>VIN</th>

            <th>SW Version</th>

            <th>Added On</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody id="tbmList">

    </tbody>

</table>
</div>

<script>

const SERVER =
"https://fota-demo.onrender.com";

async function addTBM(){

    const vin =
    document.getElementById(
        "vin"
    ).value;

    const sw =
    document.getElementById(
        "sw"
    ).value;

    await fetch(

        SERVER +
        "/register_tbm" +

        "?vin=" +
        encodeURIComponent(vin) +

        "&sw_version=" +
        encodeURIComponent(sw),

        {
            method:"POST"
        }
    );

    loadTBMs();
}

async function deleteTBM(vin){

    await fetch(

        SERVER +
        "/registered_tbm/" +
        vin,

        {
            method:"DELETE"
        }
    );

    loadTBMs();
}

async function loadTBMs(){

    const response =
    await fetch(
        SERVER +
        "/registered_tbms"
    );

    const data =
    await response.json();

    const div =
    document.getElementById(
        "tbmList"
    );

 div.innerHTML = "";

    data.forEach(t=>{

        div.innerHTML += `
        <tr>
        
            <td>
                <span class="vin-badge">
                    ${t.vin}
                </span>
            </td>
        
            <td>
                <span class="sw-badge">
                    ${t.sw_version}
                </span>
            </td>
        
            <td>
                ${new Date(t.added_on).toLocaleString(
                    "en-IN",
                    {
                        timeZone: "Asia/Kolkata"
                    }
                )}
            </td>
        
            <td>
                <button
                    class="delete-btn"
                    onclick="deleteTBM('${t.vin}')">
                    Delete
                </button>
            </td>
        
        </tr>
        `;
    });
}

loadTBMs();

</script>

</body>

</html>
